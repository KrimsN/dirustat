[package]
name = "dirustat-ntfs-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace root: this crate is not part of the main workspace, so `cargo build`, `cargo deny`
# and `cargo xtask ci` never see libfuzzer-sys. Run with `cargo +nightly fuzz run parse_record` from
# `crates/ntfs`.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
dirustat-ntfs = { path = ".." }

[[bin]]
name = "parse_record"
path = "fuzz_targets/parse_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_data_runs"
path = "fuzz_targets/decode_data_runs.rs"
test = false
doc = false
bench = false
