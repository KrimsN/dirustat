[package]
name = "dirustat-ntfs"
description = "L0: fast NTFS MFT parsing (the only isolated unsafe zone)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true


[features]
# Exposes `testutil` (synthetic MFT record builders) to the tests of higher layers. Never enable in releases.
testutil = []

[dependencies]

[dev-dependencies]
proptest.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

# The only crate where unsafe is allowed (see docs/adr/0002-mft-unsafe-isolation.md).
# Every unsafe block must carry a `// SAFETY:` comment. Other lints match the workspace.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
print_stdout = "warn"
print_stderr = "warn"
