[package]
name = "dirustat-ntfs"
description = "L0: fast NTFS MFT parsing (the only isolated unsafe zone)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true


[dependencies]

# The only crate where unsafe is allowed (see docs/adr/0002-mft-unsafe-isolation.md).
# Every unsafe block must carry a `// SAFETY:` comment. Other lints match the workspace.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
print_stdout = "warn"
print_stderr = "warn"
