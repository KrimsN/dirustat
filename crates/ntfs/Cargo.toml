[package]
name = "dirustat-ntfs"
description = "L0: быстрый разбор NTFS MFT (единственная изолированная unsafe-зона)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true


[dependencies]

# Единственный крейт, где допустим unsafe (см. docs/adr/0002-mft-unsafe-isolation.md).
# Каждый unsafe-блок обязан иметь комментарий `// SAFETY:`. Остальные lints — как в workspace.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
print_stdout = "warn"
print_stderr = "warn"
