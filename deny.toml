# cargo deny check — licenses and dependency sources
[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "OFL-1.1"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Forbidden UI/web shells (AGENTS.md rule: Rust only, no webview)
deny = [{ name = "tauri" }, { name = "wry" }, { name = "electron" }, { name = "webview2-com" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
