# Performance budgets. enforce = false until measurements exist; set true after the first measurement.
# Measured in release on reference trees (see docs/performance.md).

[scan_portable_1m_files_ssd]
# Measured 2026-10-13 (Windows 11, release, fixtures 1m-seed1, 1.0M nodes): warm cache 1.43 s;
# cold first scan right after generation 125 s (open: find out why, see devlog M1.5).
# enforce stays false until a cold-cache measurement is defined and met.
budget_seconds = 25.0
enforce = false

[scan_mft_1m_files_ntfs]
# Measured 2026-10-15 (Windows 11, release, elevated, 1,000,029-node NTFS fixture on a dynamic VHDX on NVMe,
# MFT 977 MiB): 0.31 s, 0.74 s, 3.26 s (3 runs). CPU part (parse+merge+build) is ~0.25 s; the rest is raw reads.
# Run 3 exceeded the budget with ~2.7 s unexplained inside collect (G-052). Same fixture on a VHDX placed on a
# Storage Space (HDD-backed): 10-65 s, i.e. bound by that disk (22-55 MB/s), not by the code.
# enforce stays false until the outlier is explained.
budget_seconds = 3.0
enforce = false

[treemap_layout_1m_nodes]
budget_ms = 150
enforce = false

[treemap_render_frame_1m_nodes]
budget_ms = 8
enforce = false

[treemap_cushion_shading_100k_nodes_1080p]
# Cushion surfaces plus per-pixel shading of every leaf tile, run once per layout on a background thread
# (not per frame; a frame paints one cached texture). Measured 2026-10-23 (Windows 11, release, single
# thread, `cargo run --release -p dirustat-treemap --example cushion_bench`, 100,101-node synthetic tree
# capped at 50,000 tiles): 1920x1080 11.3-12.0 ms (5.3 ns/px, surfaces 0.4 ms); 3840x2160 43.5 ms;
# 200,000-tile cap at 1080p 15.9 ms. Excludes layout (12-14 ms for the same tree).
budget_ms = 25
enforce = false

[ui_first_paint_after_scan_start]
budget_ms = 300
enforce = false
